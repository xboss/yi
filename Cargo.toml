[package]
name = "yi"
version = "0.1.0"
edition = "2024"
description = "yi translator"
license = "MIT"

[target.'cfg(target_os = "macos")'.dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
translation-rs = "=0.5.2"
